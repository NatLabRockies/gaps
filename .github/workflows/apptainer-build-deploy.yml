name: Apptainer Build and Publish

on:
  push:
    tags:
      - '*'

jobs:
  build-publish-container:
    name: Build and Publish for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: gaps.sif
            asset_name: gaps-linux-amd64-$tag.sif
        #   - os: windows-latest
        #     artifact_name: mything.exe
        #     asset_name: mything-windows-amd64
        #   - os: macos-latest
        #     artifact_name: mything
        #     asset_name: mything-macos-amd64
    permissions:
      contents: write

    container:
      image: apptainer/apptainer:1.2.5
      options: --privileged

    steps:

      - name: Check out code for the container builds
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Build Container
        run: |
           singularity build gaps.sif Apptainer

    #   - name: Login and Deploy Container
    #     run: |
    #        echo ${{ secrets.GITHUB_TOKEN }} | singularity remote login -u ${{ secrets.GHCR_USERNAME }} --password-stdin oras://ghcr.io
    #        singularity push container.sif oras://ghcr.io/${GITHUB_REPOSITORY}:${tag}

      - name: Upload container to release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME_TEMPLATE: ${{ matrix.asset_name }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            apt-get update
            apt-get install -y gh
          fi

          tag="${GITHUB_REF_NAME}"
          asset_name="${ASSET_NAME_TEMPLATE/\$tag/$tag}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --verify-tag
          fi

          gh release upload "$tag" "${{ matrix.artifact_name }}#$asset_name" --clobber
