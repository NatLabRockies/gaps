version: 2
updates:

- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
    day: monday
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns:
        - "*"
  commit-message:
    prefix: "ci"
  open-pull-requests-limit: 10
  labels:
    - "chore"
    - "dependencies"
    - "github_actions"
